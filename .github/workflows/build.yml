name: Build TR-1200 for MPC X (32-bit ARM)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install 32-bit ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
      - name: Build TR-1200.so (32-bit ARM)
        run: |
          arm-linux-gnueabihf-g++ -shared -fPIC -O2 -march=armv7-a -mfloat-abi=hard -o TR-1200.so plugin.cpp
          file TR-1200.so
          ls -lh TR-1200.so
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TR-1200-MPC-X-32bit
          path: TR-1200.so
