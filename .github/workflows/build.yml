name: Build TR-1200 for MPC X (32-bit ARM)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install 32-bit ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
      - name: Configure CMake (32-bit ARM)
        run: |
          cmake -B build -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=armv7-a -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc -DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++ -DCMAKE_C_FLAGS="-march=armv7-a -mfloat-abi=hard" -DCMAKE_CXX_FLAGS="-march=armv7-a -mfloat-abi=hard" -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: |
          cmake --build build --config Release
      - name: Locate .so
        run: |
          SO=$(find build -name "*.so" | head -1)
          echo "Found: $SO"
          cp "$SO" TR-1200.so
          file TR-1200.so
          ls -lh TR-1200.so
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TR-1200-MPC-X-32bit
          path: TR-1200.so
